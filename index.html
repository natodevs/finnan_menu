<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fintech - Saldo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container mobile-frame d-flex flex-column justify-content-between">
        
        <header class="d-flex justify-content-between align-items-center mt-4 mb-5">
            <div class="dropdown-trigger text-primary fw-bold">
                Outubro <i class="bi bi-chevron-down"></i>
            </div>
            <div class="settings-icon text-primary">
                <i class="bi bi-gear-fill fs-4"></i>
            </div>
        </header>

        <main class="text-center flex-grow-1 d-flex flex-column justify-content-center">
            
            <div class="mb-5">
                <p class="text-secondary mb-1">Saldo mensal <i class="bi bi-chevron-down" style="font-size: 0.7rem;"></i></p>
                <h1 class="display-4 fw-bold text-white">R$ 500,00</h1>
                <div class="mt-2 text-secondary">
                    <i class="bi bi-eye"></i>
                </div>
            </div>

            <div class="row w-100 mx-auto mt-4">
                
                <div class="col-6">
                    <div class="d-flex align-items-center justify-content-center mb-2">
                        <i class="bi bi-arrow-up-circle-fill text-success me-2 fs-5"></i>
                        <span class="text-secondary small-text">Receitas</span>
                    </div>
                    <h3 class="custom-green fw-bold">R$ 1000,00</h3>
                </div>

                <div class="col-6">
                    <div class="d-flex align-items-center justify-content-center mb-2">
                        <i class="bi bi-arrow-down-circle-fill text-danger me-2 fs-5"></i>
                        <span class="text-secondary small-text">Gastos</span>
                    </div>
                    <h3 class="custom-red fw-bold">R$ 500,00</h3>
                </div>
            </div>

        </main>

        <footer class="text-center mb-4">
            <button class="btn btn-primary rounded-circle fab-button">
                <i class="bi bi-plus fs-1"></i>
            </button>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
